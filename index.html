<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#b91c1c">
  <title>Stock Tampon</title>

  <!-- SCANNER QR / CODE-BARRES -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    body {
      min-height: 100vh;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* APPLICATION */
    .application {
      width: 100%;
      max-width: 650px;
      min-height: 100vh;
      margin: 0 auto;
      background: #ffffff;
    }

    /* EN-TÊTE */
    .entete {
      background: #b91c1c;
      color: white;
      padding: 25px 20px 22px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    .entete h1 {
      margin: 0;
      font-size: 25px;
      font-weight: 800;
    }

    .entete p {
      margin: 7px 0 0;
      font-size: 14px;
      opacity: 0.92;
    }

    /* CONTENU */
    .contenu {
      padding: 22px 18px 35px;
    }

    .etape {
      display: none;
    }

    .etape.active {
      display: block;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 23px;
      line-height: 1.2;
    }

    .description {
      margin: 0 0 22px;
      color: #6b7280;
      line-height: 1.45;
      font-size: 15px;
    }

    /* BOUTONS PRINCIPAUX */
    .bouton-principal {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 23px 18px;
      margin-bottom: 14px;
      font-size: 18px;
      font-weight: 800;
      text-align: left;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      transition: transform 0.1s;
    }

    .bouton-principal:active {
      transform: scale(0.98);
    }

    .bouton-principal .icone {
      font-size: 30px;
      display: block;
      margin-bottom: 7px;
    }

    .bouton-principal .titre {
      display: block;
      font-size: 18px;
    }

    .bouton-principal .sous-titre {
      display: block;
      margin-top: 5px;
      font-size: 13px;
      font-weight: normal;
      opacity: 0.72;
    }

    .bouton-prendre {
      background: #b91c1c;
      color: white;
    }

    .bouton-rendre {
      background: #f3f4f6;
      color: #111827;
      border: 2px solid #e5e7eb;
    }

    /* CHAMPS */
    label.titre-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 800;
      font-size: 15px;
    }

    select,
    input[type="text"] {
      width: 100%;
      padding: 15px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      background: white;
      font-size: 17px;
      outline: none;
    }

    select:focus,
    input[type="text"]:focus {
      border-color: #b91c1c;
      box-shadow: 0 0 0 3px rgba(185,28,28,0.12);
    }

    /* CARTES ÉQUIPEMENTS */
    .equipements-choix {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .carte-equipement {
      position: relative;
    }

    .carte-equipement input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .carte-equipement label {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 18px;
      border: 2px solid #e5e7eb;
      border-radius: 16px;
      background: #ffffff;
      cursor: pointer;
      transition: 0.15s;
    }

    .carte-equipement input:checked + label {
      border-color: #b91c1c;
      background: #fff1f2;
    }

    .carte-equipement .equipement-image {
      width: 78px;
      height: 88px;
      object-fit: contain;
      display: block;
      flex: 0 0 78px;
      margin-right: 14px;
    }

    .carte-equipement label .texte-equipement {
      min-width: 0;
      flex: 1;
    }

    .carte-equipement .nom {
      display: block;
      font-size: 17px;
      font-weight: 800;
    }

    .carte-equipement .sous-nom {
      display: block;
      margin-top: 7px;
      color: #6b7280;
      font-size: 13px;
    }

    /* BOUTONS NAVIGATION */
    .boutons {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    .bouton {
      border: none;
      border-radius: 12px;
      padding: 15px 18px;
      font-size: 16px;
      font-weight: 800;
    }

    .precedent {
      flex: 1;
      background: #e5e7eb;
      color: #111827;
    }

    .suivant {
      flex: 2;
      background: #b91c1c;
      color: white;
    }

    .bouton-large {
      width: 100%;
    }

    /* BLOCS IDENTIFICATION */
    .bloc-identification {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 15px;
    }

    .bloc-identification h3 {
      margin: 0 0 13px;
      font-size: 17px;
    }

    .equipement-image-identification {
      width: 44px;
      height: 48px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .titre-identification {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ligne-scan {
      display: flex;
      gap: 8px;
    }

    .ligne-scan input {
      flex: 1;
      min-width: 0;
    }

    .bouton-scan {
      flex: 0 0 auto;
      border: none;
      border-radius: 12px;
      background: #111827;
      color: white;
      padding: 0 17px;
      font-size: 15px;
      font-weight: 800;
    }

    /* SCANNER */
    #scanner-zone {
      display: none;
      position: fixed;
      z-index: 9999;
      inset: 0;
      background: #000000;
      color: white;
      overflow-y: auto;
    }

    .scanner-entete {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
      background: #111827;
    }

    .scanner-entete strong {
      font-size: 17px;
    }

    .fermer-scanner {
      border: none;
      background: #374151;
      color: white;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 800;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 15px auto;
      background: #000;
    }

    .scanner-message {
      text-align: center;
      padding: 10px 20px 25px;
      color: #d1d5db;
      line-height: 1.45;
    }

    .scanner-erreur {
      display: none;
      margin: 10px 20px;
      padding: 13px;
      border-radius: 12px;
      background: #7f1d1d;
      color: white;
      text-align: center;
    }

    /* RETOUR - AGENTS */
    .liste-agents {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .agent-retour {
      width: 100%;
      border: 2px solid #e5e7eb;
      border-radius: 15px;
      background: white;
      padding: 16px;
      text-align: left;
      font-size: 16px;
      font-weight: 800;
    }

    .agent-retour:active {
      transform: scale(0.99);
    }

    .agent-retour .nom-agent {
      display: block;
      font-size: 17px;
    }

    .agent-retour .nombre-equipements {
      display: block;
      margin-top: 5px;
      color: #6b7280;
      font-size: 13px;
      font-weight: normal;
    }

    /* RETOUR - ÉQUIPEMENTS */
    .info-agent {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 18px;
    }

    .info-agent strong
